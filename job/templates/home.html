<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Tracker</title>

    {% load static %}

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'job/style.css' %}">
</head>

<body>

    <!-- ========================================
         Header / Navbar
    ========================================= -->

    <header>

        <nav class="navbar navbar-expand-md bg-dark navbar-dark">

            <div class="container">

                <a class="navbar-brand" href="#">
                    Job Tracker
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div
                    class="collapse navbar-collapse"
                    id="navbarNav"
                >

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link active" href="#">Dashboard</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Applications</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>


    <!-- ========================================
         Main Content
    ========================================= -->

    <main>

        <!-- ========================================
             Dashboard
        ========================================= -->

        <section class="container py-4">

            <h2 class="mb-4">Dashboard</h2>

            <div class="row g-4">

                <div class="col-md-3">
                    <div class="card shadow-sm Dashboard-card">
                        <div class="card-body">
                            <h6 class="card-title text-muted">Total Applications</h6>
                            <h2 id="totalJobs" class="card-text">0</h2>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card shadow-sm Dashboard-card">
                        <div class="card-body">
                            <h6 class="card-title text-muted">Applied</h6>
                            <h2 id="appliedJobs" class="card-text">0</h2>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card shadow-sm Dashboard-card">
                        <div class="card-body">
                            <h6 class="card-title text-muted">Interview</h6>
                            <h2 id="interviewJobs" class="card-text">0</h2>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card shadow-sm Dashboard-card">
                        <div class="card-body">
                            <h6 class="card-title text-muted">Selected</h6>
                            <h2 id="selectedJobs" class="card-text">0</h2>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card shadow-sm Dashboard-card">
                        <div class="card-body">
                            <h6 class="card-title text-muted">Rejected</h6>
                            <h2 id="rejectedJobs" class="card-text">0</h2>
                        </div>
                    </div>
                </div>

            </div>

        </section>


        <!-- ========================================
             Add New Job
        ========================================= -->

        <section class="container py-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h2 class="mb-4">Add New Job</h2>

                    <form id="jobForm">
                        {% csrf_token %}

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label for="company" class="form-label">Company Name</label>
                                <input type="text" class="form-control" id="company" placeholder="Enter company name" required>
                            </div>

                            <div class="col-md-6">
                                <label for="role" class="form-label">Job Role</label>
                                <input type="text" class="form-control" id="role" placeholder="Enter job role" required>
                            </div>

                            <div class="col-md-6">
                                <label for="location" class="form-label">Location</label>
                                <input type="text" class="form-control" id="location" placeholder="Enter location">
                            </div>

                            <div class="col-md-6">
                                <label for="date" class="form-label">Application Date</label>
                                <input type="date" class="form-control" id="date" required>
                            </div>

                            <div class="col-md-6">
                                <label for="status" class="form-label">Status</label>
                                <select class="form-select" id="status" required>
                                    <option value="">Select Status</option>
                                    <option value="Applied">Applied</option>
                                    <option value="Interview">Interview</option>
                                    <option value="Selected">Selected</option>
                                    <option value="Rejected">Rejected</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <button type="submit" class="btn btn-primary" id="submitBtn">
                                    Add Job
                                </button>
                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </section>


        <!-- ========================================
             Job Applications
        ========================================= -->

        <section class="container py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2 class="mb-0">My Applications</h2>

                <div class="d-flex align-items-center gap-3">

                    <select id="statusFilter" class="form-select">
                        <option value="All">All Status</option>
                        <option value="Applied">Applied</option>
                        <option value="Interview">Interview</option>
                        <option value="Selected">Selected</option>
                        <option value="Rejected">Rejected</option>
                    </select>

                    <select id="sortJobs" class="form-select">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest</option>
                        <option value="company">Company A-Z</option>
                    </select>

                    <input type="text" id="searchInput" class="form-control" placeholder="Search company or role" style="width: 220px;">

                    <span id="applicationCount" class="badge text-bg-primary">0 Applications</span>

                </div>

            </div>

            <div id="jobContainer" class="row g-4"></div>

        </section>

    </main>


    <!-- ========================================
         Footer
    ========================================= -->

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-1">2026 Job Tracker</p>
            <small class="text-secondary">Built with HTML, CSS, Bootstrap & JavaScript</small>
        </div>
    </footer>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Django data + Custom JavaScript -->
    <script>
        const djangoJobs = [
            {% for job in jobs %}
            {
                id: {{ job.id }},
                company: "{{ job.company|escapejs }}",
                role: "{{ job.role|escapejs }}",
                location: "{{ job.location|escapejs }}",
                status: "{{ job.status|escapejs }}",
                date: "{{ job.applied_date|date:'Y-m-d' }}"
            },
            {% endfor %}
        ];
    </script>

    <script src="{% static 'job/scripts.js' %}"></script>

</body>

</html>
